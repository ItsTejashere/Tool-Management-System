spring.application.name=toolmanagementsystem
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/tool_management
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Settings (Updates the schema automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080